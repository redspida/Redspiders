<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser-arcade-physics.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { margin: 0; background: #050000; overflow: hidden; font-family: sans-serif; touch-action: none; -webkit-user-select: none; }
        #focus-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); color: #ff0000; display: none; align-items: center; justify-content: center; z-index: 10001; font-weight: bold; font-size: 28px; cursor: pointer; text-shadow: 0 0 15px #f00; }
        #menu, #shop-popup { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(15, 0, 0, 0.98); padding: 35px; border: 3px solid #ff0000; color: white; text-align: center; z-index: 9999; border-radius: 15px; width: 320px; box-shadow: 0 0 30px #aa0000; }
        #shop-popup { display: none; width: 350px; }
        .input-wrap { position: relative; width: 90%; margin: 0 auto 12px auto; }
        input { padding: 12px; width: 100%; border-radius: 8px; border: 1px solid #400; background: #1a0000; color: white; outline: none; box-sizing: border-box; }
        .color-picker { display: flex; justify-content: center; gap: 8px; margin-bottom: 15px; }
        .color-box { width: 40px; height: 40px; border: 2px solid #555; border-radius: 5px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .color-box.active { border-color: white; transform: scale(1.1); box-shadow: 0 0 10px white; }
        #play-btn, .close-btn { width: 100%; padding: 18px; background: #990000; color: white; border: none; font-weight: bold; cursor: pointer; border-radius: 8px; margin-top: 15px; font-size: 20px; }
        .shop-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        .shop-item { background: #220000; border: 2px solid #600; padding: 10px; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        .shop-item:hover { border-color: #f00; background: #330000; }
        .shop-item h4 { margin: 0; font-size: 14px; color: #ff3333; }
        .shop-item p { margin: 5px 0; font-size: 11px; color: #ccc; }
        .shop-item .cost { font-weight: bold; color: #ffd700; font-size: 12px; }
        #id-container { position: fixed; top: 10px; left: 10px; display: flex; gap: 5px; z-index: 1000; }
        #id-display { color: #ff3333; background: rgba(0, 0, 0, 0.8); padding: 8px; border-radius: 5px; font-family: monospace; border: 1px solid #600; font-size: 11px; }
        #copy-btn { background: #400; color: #ff3333; border: 1px solid #ff0000; padding: 8px; border-radius: 5px; cursor: pointer; font-size: 10px; font-weight: bold; min-width: 65px; }
        #chat-container { position: fixed; top: 50px; left: 10px; width: 250px; z-index: 1000; pointer-events: none; }
        #chat-box { height: 140px; background: rgba(0, 0, 0, 0.15); border-radius: 5px; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; padding: 5px; margin-bottom: 5px; border: 1px solid rgba(255,0,0,0.1); }
        .chat-msg { color: white; font-size: 11px; margin-bottom: 2px; background: rgba(0,0,0,0.5); padding: 3px 6px; border-radius: 4px; word-wrap: break-word; border-left: 2px solid #ff0000; }
        .chat-input-row { display: flex; gap: 5px; pointer-events: auto; }
        #chat-input { flex-grow: 1; background: rgba(20, 0, 0, 0.9); border: 1px solid #800; color: white; padding: 8px; border-radius: 5px; }
        #chat-log-btn { background: transparent; color: #ff3333; border: 2px solid #ff0000; padding: 5px 8px; border-radius: 5px; cursor: pointer; font-size: 16px; }
        #log-popup { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 350px; height: 450px; background: rgba(15,0,0,0.98); border: 2px solid #f00; z-index: 10000; border-radius: 10px; flex-direction: column; padding: 15px; box-shadow: 0 0 50px #000; }
        #log-content { flex-grow: 1; overflow-y: auto; background: #000; padding: 10px; border: 1px solid #300; margin-bottom: 10px; color: #ccc; font-size: 13px; line-height: 1.4; }
        #nav-right { position: fixed; top: 10px; right: 10px; display: flex; gap: 10px; z-index: 1000; }
        .nav-btn { padding: 10px 15px; background: transparent; color: #ff3333; border: 2px solid #ff0000; border-radius: 8px; cursor: pointer; font-weight: bold; }
        #ui-container { position: fixed; top: 60px; right: 10px; display: flex; flex-direction: column; gap: 5px; z-index: 1000; align-items: flex-end; }
        .bar-bg { width: 150px; height: 20px; background: #333; border: 2px solid #ff0000; border-radius: 5px; overflow: hidden; position: relative; }
        #health-fill { width: 100%; height: 100%; background: #ff0000; transition: width 0.2s; float: right; }
        .bar-text { position: absolute; left: 5px; top: 0px; color: white; font-weight: bold; font-size: 12px; z-index: 1001; }
        #leaderboard { background: rgba(20, 0, 0, 0.85); border: 2px solid #600; padding: 10px; border-radius: 8px; width: 220px; color: #fff; font-size: 12px; margin-top: 5px; }
        .lb-header { font-weight: bold; border-bottom: 1px solid #ff0000; color: #ff3333; display: grid; grid-template-columns: 2fr 1fr 1fr; }
        .lb-row { display: grid; grid-template-columns: 2fr 1fr 1fr; margin-bottom: 2px; }
        #boost-indicator { color: #ffd700; font-weight: bold; font-size: 14px; text-shadow: 0 0 5px #f00; display: none; margin-top: 5px; }
    </style>
</head>
<body onclick="handleGlobalClick(event)">
    <div id="focus-overlay" onclick="resumeAction()">CLICK TO RESUME ACTION</div>
    <div id="id-container"><div id="id-display">ID: <span id="my-id">...</span></div><button id="copy-btn" onclick="copyID()">COPY</button></div>
    <input type="text" id="copy-helper" style="position: absolute; left: -9999px;">
    
    <div id="chat-container">
        <div id="chat-box"></div>
        <div class="chat-input-row">
            <input type="text" id="chat-input" placeholder="Press Enter to chat..." onfocus="setTyping(true)" onblur="setTyping(false)" onkeydown="handleChatKeys(event, 'chat-input')">
            <button id="chat-log-btn" onclick="toggleChatLog()">📜</button>
        </div>
    </div>
    
    <div id="log-popup">
        <h3 style="color:red; margin:0 0 10px 0; display: flex; justify-content: space-between;"><span>Account History</span><span onclick="toggleChatLog()" style="cursor:pointer;">&times;</span></h3>
        <div id="log-content"></div>
        <div class="chat-input-row"><input type="text" id="log-chat-input" placeholder="Chat from history..." onfocus="setTyping(true)" onblur="setTyping(false)" onkeydown="handleChatKeys(event, 'log-chat-input')"></div>
        <button class="close-btn" onclick="toggleChatLog()" style="padding:10px; margin-top:10px; font-size: 14px;">Close</button>
    </div>

    <div id="nav-right"><button class="nav-btn" onclick="toggleShop()">🛒 SHOP</button><button class="nav-btn" onclick="toggleMenu()">MENU (M)</button></div>
    
    <div id="ui-container">
        <div class="bar-bg"><div class="bar-text" id="hp-label">100 HP</div><div id="health-fill"></div></div>
        <div class="bar-bg" style="border-color:#888;"><span style="position:absolute;left:5px;top:0px;font-size:12px;">🔴</span><div class="bar-text" id="ruby-count-text" style="margin-left:22px;">0</div></div>
        <div id="boost-indicator">🔥 2X BOOST ACTIVE! 🔥</div>
        <div id="leaderboard"><div class="lb-header"><span>NAME</span><span>K/D</span><span>RUBIES</span></div><div id="lb-content"></div></div>
    </div>

    <div id="shop-popup">
        <h2 style="color: #ff0000; margin: 0;">UPGRADE SHOP</h2>
        <div class="shop-grid">
            <div class="shop-item" onclick="buyUpgrade('speed')"><h4>SPEED</h4><p>+10% Movement</p><div class="cost">500 Rubies</div></div>
            <div class="shop-item" onclick="buyUpgrade('jump')"><h4>JUMP</h4><p>+10% Height</p><div class="cost">500 Rubies</div></div>
            <div class="shop-item" onclick="buyUpgrade('damage')"><h4>DAMAGE</h4><p>+10% Pushes</p><div class="cost">500 Rubies</div></div>
            <div class="shop-item" onclick="buyUpgrade('kb')"><h4>KNOCKBACK</h4><p>+10% Power</p><div class="cost">500 Rubies</div></div>
        </div>
        <button class="close-btn" onclick="toggleShop()">BACK</button>
    </div>
    
    <div id="menu">
        <h2 style="color: #ff0000; margin: 0 0 10px 0;">REDSPIDERS GAME</h2>
        <div class="input-wrap"><input type="text" id="username" placeholder="USERNAME" onfocus="setTyping(true)" onblur="setTyping(false)"></div>
        <div class="input-wrap"><input type="password" id="password" placeholder="PASSWORD" onfocus="setTyping(true)" onblur="setTyping(false)"></div>
        <div class="color-picker">
            <div class="color-box active" style="background:red;" onclick="selectColor(0, 0xff0000)">1</div>
            <div class="color-box" style="background:#00008B;" onclick="selectColor(1, 0x00008B)">2</div>
            <div class="color-box" style="background:orange;" onclick="selectColor(2, 0xffa500)">3</div>
            <div class="color-box" style="background:#FF00FF;" onclick="selectColor(3, 0xff00ff)">4</div>
            <div class="color-box" style="background:purple;" onclick="selectColor(4, 0x800080)">5</div>
        </div>
        <input style="width:90%; margin: 0 auto 10px auto; display:block;" type="text" id="friendID" placeholder="JOIN WORLD ID..." onfocus="setTyping(true)" onblur="setTyping(false)">
        <button id="play-btn" onclick="startGame()">DROP DOWN</button>
    </div>

    <script>
        let player, platforms, otherPlayers, cursors, keys, myNameTag, chargeBar, rubies, portals, starLayer, towerLayer;
        let gameHasFocus = false, myUsername = "", typingMode = false, shopOpen = false, logOpen = false;
        let peer, conn, remotePlayers = {}, rubyMap = {};
        let jumpCount = 0, chargeTimer = 0, isCharging = false, lastWarpTime = 0, myHealth = 100, myRubies = 0;
        let myKills = 0, myDeaths = 0, lastHitBy = null, lastHitTime = 0;
        let joyBase, joyThumb, btnJump, btnPush, pushActive = false, joyPointer = null, joyMoveX = 0;
        let accountKey = "", selectedColorHex = 0xff0000, currentFacing = 1, trailTimer = 0;

        let multSpeed = 1.0, multJump = 1.0, multDmg = 1.0, multKB = 1.0;
        let boostActive = false;
        const BOOST_INTERVAL = 240000; 
        const BOOST_DURATION = 180000; 

        function selectColor(index, hex) {
            selectedColorHex = hex;
            const boxes = document.querySelectorAll('.color-box');
            boxes.forEach((b, i) => b.classList.toggle('active', i === index));
        }

        function setTyping(val) { typingMode = val; if(val && player?.body) player.setVelocityX(0); }
        
        function saveStats() { 
            if (accountKey) { 
                localStorage.setItem(`rubies_${accountKey}`, myRubies); 
                localStorage.setItem(`kills_${accountKey}`, myKills);
                localStorage.setItem(`deaths_${accountKey}`, myDeaths);
                localStorage.setItem(`mSpeed_${accountKey}`, multSpeed);
                localStorage.setItem(`mJump_${accountKey}`, multJump);
                localStorage.setItem(`mDmg_${accountKey}`, multDmg);
                localStorage.setItem(`mKB_${accountKey}`, multKB);
            } 
        }

        window.buyUpgrade = (type) => {
            if (myRubies >= 500) {
                myRubies -= 500;
                if (type === 'speed') multSpeed += 0.10;
                if (type === 'jump') multJump += 0.10;
                if (type === 'damage') multDmg += 0.10;
                if (type === 'kb') multKB += 0.10;
                saveStats(); updateUI(); addChatMessage("SYSTEM", `Purchased ${type} upgrade (+10%)!`);
            } else { addChatMessage("SYSTEM", "Not enough rubies!"); }
        };

        window.copyID = () => {
            const idText = document.getElementById('my-id').innerText;
            const helper = document.getElementById('copy-helper');
            helper.value = idText; helper.select();
            document.execCommand('copy');
            document.getElementById('copy-btn').innerText = "COPIED!";
            setTimeout(() => { document.getElementById('copy-btn').innerText = "COPY"; }, 2000);
        };

        function handleChatKeys(e, inputId) {
            if (e.key === 'Enter') {
                const input = document.getElementById(inputId);
                const text = input.value.trim();
                if (text) {
                    if (conn?.open) conn.send({ type: 'CHAT', name: myUsername, text: text });
                    addChatMessage(myUsername, text);
                    input.value = "";
                }
                input.blur(); if (game && game.canvas) game.canvas.focus();
            }
            e.stopPropagation();
        }

        function addChatMessage(name, text) {
            const box = document.getElementById('chat-box');
            const log = document.getElementById('log-content');
            const div = document.createElement('div');
            div.className = 'chat-msg';
            div.innerHTML = `<strong>${name}:</strong> ${text}`;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
            setTimeout(() => { if(div.parentNode) box.removeChild(div); }, 10000);
            const logDiv = document.createElement('div');
            logDiv.innerHTML = `<span style="color:#666; font-size:10px;">[${new Date().toLocaleTimeString()}]</span> <b style="color:#f33;">${name}:</b> ${text}`;
            log.appendChild(logDiv);
            log.scrollTop = log.scrollHeight;
        }

        function handleGlobalClick(e) { if (e.target.tagName !== 'INPUT' && gameHasFocus && !shopOpen && !logOpen) resumeAction(); }
        function resumeAction() { document.getElementById('focus-overlay').style.display = 'none'; setTyping(false); window.focus(); }

        const config = { type: Phaser.AUTO, width: window.innerWidth, height: window.innerHeight, physics: { default: 'arcade', arcade: { gravity: { y: 1600 } } }, input: { activePointers: 5 }, scene: { preload, create, update } };
        const game = new Phaser.Game(config);

        function preload() {}

        function create() {
            this.physics.world.setBounds(0, 0, 5000, 2000);
            
            towerLayer = this.add.graphics().setScrollFactor(0.2);
            for(let i=0; i<30; i++) {
                let color = Math.random() > 0.5 ? 0x1a1a1a : 0x2a2a2a;
                towerLayer.fillStyle(color, 1);
                towerLayer.fillRect(Math.random()*5000, 400 + Math.random()*1000, 100 + Math.random()*200, 2000);
            }

            starLayer = this.add.graphics().setScrollFactor(0.1);
            for (let i = 0; i < 600; i++) { starLayer.fillStyle(0xffffff, Math.random()); starLayer.fillCircle(Math.random()*5000, Math.random()*2000, Math.random()*1.5); }
            
            platforms = this.physics.add.staticGroup(); 
            otherPlayers = this.physics.add.group(); 
            rubies = this.physics.add.staticGroup(); 
            portals = this.physics.add.staticGroup();

            const createPlat = (x, y, length) => {
                for (let i = 0; i < length; i++) {
                    let px = x + (i * 64);
                    let p = this.add.rectangle(px, y, 64, 32, 0x252525);
                    this.physics.add.existing(p, true); platforms.add(p);
                    if (Math.random() < 0.75) spawnTieredRuby(px, y - 45);
                }
            };
            createPlat(2200, 650, 12); createPlat(3000, 400, 5); createPlat(2400, 850, 10); 
            createPlat(1500, 1000, 4); createPlat(3200, 1100, 6); createPlat(4200, 1300, 3); 
            createPlat(800, 1100, 5); createPlat(2000, 1500, 8); createPlat(3800, 450, 4);  
            createPlat(500, 950, 3); createPlat(2800, 1250, 2); createPlat(100, 750, 8); 
            createPlat(1100, 850, 10); createPlat(3800, 850, 12); createPlat(500, 450, 4); 
            createPlat(1600, 550, 6); createPlat(650, 1300, 5); createPlat(1800, 1400, 15);
            
            spawnPortal(300, 500, 4500, 600); spawnPortal(4500, 600, 300, 500);

            player = this.add.rectangle(2500, 400, 40, 40, selectedColorHex);
            this.physics.add.existing(player);
            player.body.setCollideWorldBounds(true).setDragX(1500).setBounce(0);
            
            myNameTag = this.add.text(player.x, player.y - 70, '', { fontSize: '18px', fill: '#fff' }).setOrigin(0.5);
            chargeBar = this.add.graphics();
            this.physics.add.collider(player, platforms);
            this.physics.add.overlap(player, rubies, collectRuby, null, this);
            this.physics.add.overlap(player, portals, handleWarp, null, this);
            
            setupMobileControls(this);
            cursors = this.input.keyboard.createCursorKeys(); 
            keys = this.input.keyboard.addKeys('W,A,S,D,E,M,SHIFT');
            this.cameras.main.startFollow(player, true, 0.1, 0.1).setBackgroundColor('#050000');
            
            peer = new Peer(); 
            peer.on('open', id => document.getElementById('my-id').innerText = id);
            peer.on('connection', setupConnection); 
            
            setInterval(() => {
                boostActive = true;
                document.getElementById('boost-indicator').style.display = 'block';
                addChatMessage("SYSTEM", "🔥 2X BOOST ACTIVE FOR 3 MINUTES! 🔥");
                setTimeout(() => {
                    boostActive = false;
                    document.getElementById('boost-indicator').style.display = 'none';
                    addChatMessage("SYSTEM", "Boost has faded away...");
                }, BOOST_DURATION);
            }, BOOST_INTERVAL);

            this.scene.pause();
        }

        function createTrail(x, y, color) {
            let t = game.scene.scenes[0].add.rectangle(x, y, 35, 35, color, 0.6);
            game.scene.scenes[0].tweens.add({ targets: t, alpha: 0, scale: 0.2, duration: 400, onComplete: () => t.destroy() });
        }

        function update(time, delta) {
            if (!gameHasFocus || typingMode || shopOpen || logOpen) return;
            if (Phaser.Input.Keyboard.JustDown(keys.M)) toggleMenu();
            
            let vx = 0;
            let currentMultSpeed = boostActive ? (multSpeed * 2) : multSpeed;
            let currentMultJump = boostActive ? (multJump * 2) : multJump;

            let baseSpeed = 450 * currentMultSpeed;
            if (cursors.left.isDown || keys.A.isDown || (joyPointer && joyMoveX < -0.3)) { vx = -baseSpeed; currentFacing = -1; }
            else if (cursors.right.isDown || keys.D.isDown || (joyPointer && joyMoveX > 0.3)) { vx = baseSpeed; currentFacing = 1; }
            player.body.setVelocityX(vx || player.body.velocity.x * 0.8);
            
            if (Math.abs(player.body.velocity.x) > 50 || Math.abs(player.body.velocity.y) > 50) {
                trailTimer += delta;
                if (trailTimer > 60) { createTrail(player.x, player.y, selectedColorHex); trailTimer = 0; }
            }

            if (player.body.touching.down) jumpCount = 0;
            if ((Phaser.Input.Keyboard.JustDown(cursors.up) || Phaser.Input.Keyboard.JustDown(keys.W)) && jumpCount < 2) { 
                player.body.setVelocityY(-850 * currentMultJump); jumpCount++; 
            }

            chargeBar.clear();
            if (keys.E.isDown || keys.SHIFT.isDown || pushActive) {
                isCharging = true; chargeTimer = Math.min(chargeTimer + delta, 2000);
                drawChargeBar(chargeBar, player.x, player.y, chargeTimer / 2000, true);
                if (Phaser.Input.Keyboard.JustDown(keys.E)) triggerNormalPush();
            } else if (isCharging) handleAttackRelease();
            
            otherPlayers.children.iterate(p => { 
                if (p && p.charging) drawChargeBar(chargeBar, p.x, p.y, p.chargeVal, false); 
            });
            
            myNameTag.setPosition(player.x, player.y - 70).setText(`${myUsername} [${Math.ceil(myHealth)}/100]`);
            if (conn?.open) conn.send({ type: 'MOVE', x: player.x, y: player.y, name: myUsername, charging: isCharging, chargeVal: chargeTimer / 2000, hp: myHealth, kills: myKills, deaths: myDeaths, rubies: myRubies, color: selectedColorHex, facing: currentFacing });
            if (player.y > 1800) handleDeath(Date.now() - lastHitTime < 3000 ? 'void_pushed' : 'void_fall');
        }

        function updateUI() {
            document.getElementById('health-fill').style.width = myHealth + '%';
            document.getElementById('hp-label').innerText = Math.ceil(myHealth) + ' HP';
            document.getElementById('ruby-count-text').innerText = Math.floor(myRubies);
            updateLeaderboard();
        }

        function spawnTieredRuby(x, y) {
            let rubyId = `ruby_${x}_${y}`; if (rubyMap[rubyId]) return;
            let rand = Math.random() * 100;
            let val = 1, size = '14px'; 
            if (rand < 0.25) { val = 200; size = '55px'; } 
            else if (rand < 5) { val = 10; size = '40px'; } 
            else if (rand < 15) { val = 5; size = '30px'; } 
            else if (rand < 40) { val = 3; size = '22px'; } 
            let r = game.scene.scenes[0].add.text(x, y, "🔴", { fontSize: size }).setOrigin(0.5);
            game.scene.scenes[0].physics.add.existing(r, true);
            r.value = val; r.rubyId = rubyId;
            rubies.add(r); rubyMap[rubyId] = r;
        }

        function collectRuby(p, r) {
            const id = r.rubyId; myRubies += r.value; myHealth = Math.min(100, myHealth + (r.value >= 10 ? 15 : 2)); 
            saveStats();
            if (conn?.open) conn.send({ type: 'RUBY_TAKEN', rubyId: id });
            removeRubyLocal(id); updateUI();
            setTimeout(() => { if (gameHasFocus) { spawnTieredRuby(r.x, r.y); if (conn?.open) conn.send({ type: 'RUBY_SPAWN', x: r.x, y: r.y }); }}, r.value === 200 ? 120000 : 8000);
        }

        function updateLeaderboard() {
            let list = [{ name: myUsername, kills: myKills, deaths: myDeaths, rubies: myRubies }];
            for (let id in remotePlayers) { let p = remotePlayers[id]; list.push({ name: p.userName || "Guest", kills: p.kills || 0, deaths: p.deaths || 0, rubies: p.rubies || 0 }); }
            list.sort((a, b) => b.kills - a.kills);
            let html = "";
            list.forEach(item => { let kd = item.deaths === 0 ? item.kills : (item.kills / item.deaths).toFixed(1); html += `<div class="lb-row"><span>${item.name}</span><span>${kd}</span><span>${Math.floor(item.rubies)}</span></div>`; });
            document.getElementById('lb-content').innerHTML = html;
        }

        function handleDeath(cause) {
            myDeaths++;
            let victimRubiesLost = 0;
            if (myRubies >= 75 && lastHitBy && (Date.now() - lastHitTime < 5000)) {
                victimRubiesLost = 75;
                myRubies -= 75;
            } else {
                myRubies = Math.max(0, myRubies - (cause === 'void_pushed' ? 35 : 20)); 
            }
            saveStats();
            
            if (lastHitBy && (Date.now() - lastHitTime < 5000)) { 
                if (conn?.open) conn.send({ type: 'KILLED_ME', killerId: lastHitBy, victimName: myUsername, stolen: victimRubiesLost }); 
            }
            
            player.setPosition(2500, 400); player.body.setVelocity(0,0);
            myHealth = 100; updateUI();
        }

        function setupMobileControls(scene) {
            const sw = window.innerWidth, sh = window.innerHeight;
            joyBase = scene.add.circle(120, sh - 120, 60, 0xffffff, 0.1).setScrollFactor(0).setInteractive();
            joyThumb = scene.add.circle(120, sh - 120, 30, 0xffffff, 0.3).setScrollFactor(0);
            scene.input.on('pointerdown', (p) => { if (Phaser.Math.Distance.Between(p.x, p.y, joyBase.x, joyBase.y) < 80) joyPointer = p; });
            scene.input.on('pointermove', (p) => { if (joyPointer && p.id === joyPointer.id) { 
                let angle = Phaser.Math.Angle.Between(joyBase.x, joyBase.y, p.x, p.y); 
                let dist = Math.min(Phaser.Math.Distance.Between(p.x, p.y, joyBase.x, joyBase.y), 45); 
                joyThumb.x = joyBase.x + Math.cos(angle) * dist; joyThumb.y = joyBase.y + Math.sin(angle) * dist; 
                joyMoveX = Math.cos(angle); 
            }});
            scene.input.on('pointerup', (p) => { if (joyPointer && p.id === joyPointer.id) { joyPointer = null; joyThumb.x = joyBase.x; joyThumb.y = joyBase.y; joyMoveX = 0; } });
            
            btnJump = scene.add.circle(sw - 80, sh - 100, 55, 0x888888, 0.4).setInteractive().setScrollFactor(0);
            scene.add.text(sw - 80, sh - 100, '↑', { fontSize: '40px', fill: '#ffffff' }).setOrigin(0.5).setScrollFactor(0);
            
            btnJump.on('pointerdown', () => { if (jumpCount < 2) { player.body.setVelocityY(-850 * (boostActive ? multJump * 2 : multJump)); jumpCount++; }});
            btnPush = scene.add.circle(sw - 160, sh - 180, 40, 0x888888, 0.4).setInteractive().setScrollFactor(0);
            btnPush.on('pointerdown', () => { pushActive = true; isCharging = true; triggerNormalPush(); });
            btnPush.on('pointerup', () => { pushActive = false; handleAttackRelease(); });
        }

        function triggerNormalPush() {
            let dir = currentFacing; let attackX = player.x + (dir * 35);
            if (conn?.open) conn.send({ type: 'ATTACK', pushDir: dir, x: attackX, y: player.y, isBig: false, attackerId: peer.id });
            showPushEffect(attackX, player.y, true);
        }

        function removeRubyLocal(id) { if (rubyMap[id]) { rubyMap[id].destroy(); delete rubyMap[id]; } }
        function handleWarp(p, portal) { if (Date.now() - lastWarpTime > 1500) { player.setPosition(portal.targetX, portal.targetY); lastWarpTime = Date.now(); } }
        function handleAttackRelease() { let dir = currentFacing; if (chargeTimer >= 2000) fireProjectile(player.x + (dir * 50), player.y, dir, true); chargeTimer = 0; isCharging = false; }
        
        function fireProjectile(x, y, dir, isMine) { 
            let ball = game.scene.scenes[0].add.circle(x, y, 25, isMine ? 0xffffff : 0xff0000, 1); 
            game.scene.scenes[0].physics.add.existing(ball); 
            ball.body.setAllowGravity(false).setVelocityX(dir * 1400); 
            if (isMine && conn?.open) conn.send({ type: 'ATTACK', pushDir: dir, x: x, y: y, isBig: true, attackerId: peer.id }); 
            setTimeout(() => ball.destroy(), 3000); 
        }

        function showPushEffect(x, y, isMine) { 
            let circle = game.scene.scenes[0].add.circle(x, y, 5, isMine ? 0xdddddd : 0xff0000, 0.6); 
            game.scene.scenes[0].tweens.add({ targets: circle, radius: 85, alpha: 0, duration: 200, onComplete: () => circle.destroy() }); 
        }

        function drawChargeBar(g, x, y, p, isMine) { 
            let color = isMine ? (p >= 1 ? 0xffffff : 0x888888) : (p >= 1 ? 0xff0000 : 0x660000); 
            g.fillStyle(0x000000, 0.5); g.fillRect(x - 30, y - 55, 60, 8); 
            g.fillStyle(color, 1); g.fillRect(x - 30, y - 55, 60 * p, 8); 
        }

        function setupConnection(c) {
            conn = c;
            conn.on('data', data => {
                if (data.type === 'CHAT') addChatMessage(data.name, data.text);
                if (data.type === 'MOVE') {
                    let p = remotePlayers[c.peer]; 
                    if (!p) { 
                        p = game.scene.scenes[0].add.rectangle(data.x, data.y, 40, 40, data.color || 0xff0000); 
                        game.scene.scenes[0].physics.add.existing(p); 
                        p.body.setAllowGravity(false).setImmovable(true).setBounce(0); 
                        p.tag = game.scene.scenes[0].add.text(0, 0, '', { fontSize: '14px', fill: '#f00' }).setOrigin(0.5); 
                        remotePlayers[c.peer] = p; 
                        game.scene.scenes[0].physics.add.collider(player, p);
                    }
                    p.setPosition(data.x, data.y); p.setFillStyle(data.color); p.userName = data.name; p.kills = data.kills; p.deaths = data.deaths; p.rubies = data.rubies; p.charging = data.charging; p.chargeVal = data.chargeVal; p.tag.setPosition(data.x, data.y - 70).setText(`${data.name} [${Math.ceil(data.hp)}/100]`); updateLeaderboard();
                }
                if (data.type === 'ATTACK') {
                    if (data.isBig) fireProjectile(data.x, data.y, data.pushDir, false); else showPushEffect(data.x, data.y, false);
                    let dist = Phaser.Math.Distance.Between(player.x, player.y, data.x, data.y);
                    if (dist < (data.isBig ? 400 : 130)) { 
                        let powerMult = boostActive ? (multKB * 2) : multKB;
                        let damageMult = boostActive ? (multDmg * 2) : multDmg;
                        player.body.setVelocity(data.pushDir * (data.isBig ? 1500 : 800) * powerMult, -200); 
                        myHealth -= (data.isBig ? 25 : 5) * damageMult; 
                        lastHitBy = c.peer; lastHitTime = Date.now(); updateUI(); if (myHealth <= 0) handleDeath('killed'); 
                    }
                }
                if (data.type === 'KILLED_ME' && data.killerId === peer.id) { 
                    myKills++; 
                    if (data.stolen > 0) {
                        myRubies += data.stolen;
                        addChatMessage("SYSTEM", `${myUsername} eliminated ${data.victimName} and took 75 rubies!`);
                    } else {
                        addChatMessage("SYSTEM", `${myUsername} eliminated ${data.victimName}!`);
                    }
                    saveStats(); updateUI(); 
                }
                if (data.type === 'RUBY_TAKEN') removeRubyLocal(data.rubyId);
                if (data.type === 'RUBY_SPAWN') spawnTieredRuby(data.x, data.y);
            });
        }

        function spawnPortal(x, y, tx, ty) { 
            let p = game.scene.scenes[0].add.circle(x, y, 40, 0x300000, 0.7).setStrokeStyle(3, 0xff0000); 
            game.scene.scenes[0].physics.add.existing(p, true); p.targetX = tx; p.targetY = ty; portals.add(p); 
        }
        
        function toggleChatLog() { logOpen = !logOpen; document.getElementById('log-popup').style.display = logOpen ? 'flex' : 'none'; }
        window.toggleShop = () => { shopOpen = !shopOpen; document.getElementById('shop-popup').style.display = shopOpen ? 'block' : 'none'; };
        window.toggleMenu = () => { gameHasFocus = !gameHasFocus; document.getElementById('menu').style.display = gameHasFocus ? 'none' : 'block'; if(!gameHasFocus) game.scene.pause('default'); else game.scene.resume('default'); };
        
        window.startGame = () => {
            const u = document.getElementById('username').value.trim(); const p = document.getElementById('password').value.trim();
            if (!u || !p) return alert("ENTER USERNAME AND PASSWORD");
            myUsername = u; accountKey = btoa(u + ":" + p); 
            
            let savedRubies = localStorage.getItem(`rubies_${accountKey}`);
            myRubies = savedRubies ? parseInt(savedRubies) : 0; 
            myKills = parseInt(localStorage.getItem(`kills_${accountKey}`)) || 0;
            myDeaths = parseInt(localStorage.getItem(`deaths_${accountKey}`)) || 0;
            multSpeed = parseFloat(localStorage.getItem(`mSpeed_${accountKey}`)) || 1.0;
            multJump = parseFloat(localStorage.getItem(`mJump_${accountKey}`)) || 1.0;
            multDmg = parseFloat(localStorage.getItem(`mDmg_${accountKey}`)) || 1.0;
            multKB = parseFloat(localStorage.getItem(`mKB_${accountKey}`)) || 1.0;

            player.setFillStyle(selectedColorHex);
            updateUI(); gameHasFocus = true; document.getElementById('menu').style.display = 'none'; 
            game.scene.resume('default');
            const fId = document.getElementById('friendID').value.trim(); if (fId && peer) setupConnection(peer.connect(fId));
        };
    </script>
</body>
</html>
